version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # 公開直後の版は避ける(サプライチェーン攻撃は多くが1週間以内に検知される)
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # 周辺ツールが未対応のメジャー更新は当面出さない(理由と再開条件: web-commons/docs/decisions/0007)
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, needs-human-review]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels: [dependencies, needs-human-review]
